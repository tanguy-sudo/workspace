          <div class="topbar-sep"></div>
          <span class="topbar-clock"></span
          ><button class="theme-toggle"></button><a href="settings.html" class="topbar-settings-link" aria-label="Parametres" title="Parametres"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.7 1.5l.2 1.3c.4.1.8.3 1.2.5l1.1-.7 1.6 1.6-.7 1.1c.2.4.4.8.5 1.2l1.3.2v2.3l-1.3.2c-.1.4-.3.8-.5 1.2l.7 1.1-1.6 1.6-1.1-.7c-.4.2-.8.4-1.2.5l-.2 1.3H7.4l-.2-1.3c-.4-.1-.8-.3-1.2-.5l-1.1.7-1.6-1.6.7-1.1c-.2-.4-.4-.8-.5-1.2l-1.3-.2V6.8l1.3-.2c.1-.4.3-.8.5-1.2l-.7-1.1 1.6-1.6 1.1.7c.4-.2.8-.4 1.2-.5l.2-1.3z"/><circle cx="8" cy="8" r="2"/></svg></a>
          <button
            class="topbar-menu-btn"
            aria-label="Menu"
            aria-expanded="false"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 18 18"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <path d="M2 4.5h14M2 9h14M2 13.5h14" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="app-wrapper">
        <div class="page-header">
          <div class="page-header-top">
            <div>
              <h1 class="page-title">Tâches</h1>
              <div class="page-meta">
                <span><span id="todo-count">0</span> actives</span>
              </div>
            </div>
            <div class="page-header-actions">
              <button
                id="btn-view-cols"
                class="btn btn-ghost"
                title="Vue colonnes"
              >
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                >
                  <rect x="1" y="2" width="4" height="12" rx="1" />
                  <rect x="6" y="2" width="4" height="12" rx="1" />
                  <rect x="11" y="2" width="4" height="12" rx="1" />
                </svg>
              </button>
              <button
                id="btn-view-list"
                class="btn btn-ghost"
                title="Vue liste"
              >
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                >
                  <path d="M2 4h12M2 8h12M2 12h12" />
                </svg>
              </button>
              <button
                id="btn-view-prio"
                class="btn btn-ghost"
                title="Vue priorités (drag & drop)"
              >
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                >
                  <circle cx="4" cy="4" r="2" />
                  <circle cx="12" cy="4" r="2" />
                  <circle cx="4" cy="12" r="2" />
                  <circle cx="12" cy="12" r="2" />
                </svg>
              </button>
              <button id="btn-select-mode" class="btn btn-ghost" title="Sélection multiple">
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="1.5" y="1.5" width="5" height="11" rx="1"/><path d="M9 4.5h5.5M9 8h5.5M9 11.5h5.5"/></svg>
                Sélectionner
              </button>
              <button id="btn-purge-done" class="btn btn-ghost btn-danger-ghost" title="Supprimer toutes les tâches terminées">
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                  <path d="M4 4l8 8M12 4l-8 8"/>
                  <circle cx="8" cy="8" r="6.5"/>
                </svg>
                Purger terminées
              </button>
              <button id="btn-manage-priorities" class="btn btn-ghost">
                Priorités
              </button>
              <button id="btn-new-todo" class="btn btn-primary">
                <svg
                  width="13"
                  height="13"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                >
                  <path d="M8 3v10M3 8h10" />
                </svg>
                Nouvelle tâche
              </button>
            </div>
          </div>

          <div class="page-header-filters">
            <div class="filter-bar">
              <button class="status-filter filter-btn active-accent" data-s="all">
                Toutes
              </button>
              <button class="status-filter filter-btn" data-s="todo">
                À faire
              </button>
              <button class="status-filter filter-btn" data-s="waitinginfo">
                En attente d'info
              </button>
              <button class="status-filter filter-btn" data-s="inprogress">
                En cours
              </button>
              <button class="status-filter filter-btn" data-s="done">
                Terminées
              </button>
            </div>
          </div>

          <div class="todo-saved-views-block">
            <div class="label" style="margin-bottom: 6px">Vues sauvegardées</div>
            <div class="todo-saved-views-row">
              <div class="filter-bar todo-saved-views-list" id="todo-saved-views-list"></div>
              <div class="todo-saved-views-actions">
                <button id="btn-save-view" class="btn btn-ghost btn-sm">Sauvegarder la vue</button>
                <button id="btn-manage-views" class="btn btn-ghost btn-sm">Gérer</button>
              </div>
            </div>
          </div>

          <div style="margin-top: var(--sp-3)">
            <div class="label" style="margin-bottom: 6px">Priorité</div>
            <div class="filter-bar" id="priority-filters"></div>
          </div>
          <div style="margin-top: var(--sp-3)" id="context-filter-wrap">
            <div class="label" style="margin-bottom: 6px">Contexte</div>
            <div class="filter-bar" id="context-filters"></div>
          </div>
          <div style="margin-top: var(--sp-3)" id="project-filter-wrap" style="display:none">
            <div class="label" style="margin-bottom: 6px">Projet</div>
            <div class="filter-bar" id="project-filters"></div>
          </div>
          <div style="margin-top: var(--sp-3)">
            <div class="label" style="margin-bottom: 6px">Échéance</div>
            <div class="filter-bar" id="due-filters"></div>
          </div>
        </div>

        <div id="todos-view"></div>
      </div>
    </main>

    <script src="assets/vendor/dexie.min.js"></script>
    <script src="js/db.js"></script>
    <script src="js/storage.js"></script>

    <script src="js/markdown-editor.js"></script>
    <script src="js/global-search.js"></script>

    <script src="js/favorites.js"></script>
    <script src="js/pages/todos.js"></script>
