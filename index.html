        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>

            aria-label="Menu"

              width="18"

    <main class="main-content">
      <div class="app-wrapper">
        <!-- ══ HERO ══════════════════════════════════════════ -->
        <div class="home-hero">
          <!-- Ligne 1 : salutation + badges stat -->
          <div class="hero-top">
            <div class="hero-text">
              <div class="hero-eyebrow">Workspace</div>
              <h1 class="hero-title">
                <span id="hero-greeting"></span><span class="hero-comma">,</span><br />
                <strong id="hero-datetime"></strong>
              </h1>
            </div>
            <div class="hero-stats" id="hero-stats"></div>
          </div>

          <!-- Ligne 2 : barre de recherche globale -->
          <button class="hero-search" id="hero-search-btn" type="button">
            <svg
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            >
              <circle cx="7" cy="7" r="4.5" />
              <path d="M10.5 10.5L14 14" />
            </svg>
            <span class="hero-search-placeholder"
              >Rechercher dans le workspace…</span
            >
            <kbd class="hero-search-kbd">Ctrl+Espace</kbd>
          </button>

          <!-- Ligne 3 : raccourcis visuels avec icônes et compteurs -->
          <div class="hero-shortcuts" id="hero-shortcuts"></div>
        </div>

        <!-- Rappels -->
        <div class="section">
          <div class="section-header">
            <div class="section-title">
              Rappels
              <span id="reminders-count" class="reminders-count"></span>
            </div>
            <button id="btn-new-reminder" class="btn btn-primary btn-sm">
              <svg
                width="13"
                height="13"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              >
                <circle cx="8" cy="8" r="6.5" />
                <path d="M8 4.5v3.5l2 1.5" />
              </svg>
              Nouveau rappel
            </button>
          </div>
          <div class="reminders-tabs">
            <button class="reminders-tab active" data-tab="today">
              Aujourd'hui
              <span class="reminders-tab-count" id="tab-cnt-today">0</span>
            </button>
            <button class="reminders-tab" data-tab="overdue">
              En retard
              <span class="reminders-tab-count" id="tab-cnt-overdue">0</span>
            </button>
            <button class="reminders-tab" data-tab="pinned">
              ⭐ Épinglés
              <span class="reminders-tab-count" id="tab-cnt-pinned">0</span>
            </button>
            <button class="reminders-tab" data-tab="upcoming">
              À venir
              <span class="reminders-tab-count" id="tab-cnt-upcoming">0</span>
            </button>
          </div>
          <div id="reminders-list" class="reminders-list"></div>
        </div>

        <!-- Statistiques tâches -->
        <div class="section" id="section-task-stats">
          <div class="section-header">
            <div class="section-title">Aperçu des tâches</div>
          </div>
          <div id="task-stats-grid" class="task-stats-grid"></div>
        </div>

        <div class="section" id="section-organization-health">
          <div class="section-header">
            <div class="section-title">Points d'attention</div>
          </div>
          <div id="organization-health-grid" class="organization-health-grid"></div>
        </div>

        <div class="section" id="section-weekly-review">
          <div class="section-header section-header-wrap">
            <div>
              <div class="section-title">Revue hebdomadaire</div>
              <div class="section-subtitle" id="weekly-review-status"></div>
            </div>
            <div class="weekly-review-actions">
              <button id="btn-generate-review-task" class="btn btn-ghost btn-sm">Créer une tâche de revue</button>
              <button id="btn-complete-review" class="btn btn-primary btn-sm">Marquer faite</button>
            </div>
          </div>
          <div id="weekly-review-list" class="weekly-review-list"></div>
        </div>

        <!-- Récemment visité -->
        <div class="section">
          <div class="section-header">
            <div class="section-title">Récemment visité</div>
          </div>
          <div class="recent-grid" id="recent-grid"></div>
        </div>
      </div>
    </main>
