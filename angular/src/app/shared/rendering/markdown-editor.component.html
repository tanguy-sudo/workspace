<div class="md-editor" [attr.data-mode]="mode()">
  <div class="md-toolbar">
    @for (item of toolbar; track $index) {
      @if (item.separator) {
        <span class="md-sep" aria-hidden="true"></span>
      } @else {
        <button type="button" class="md-btn" [attr.title]="item.title" (mousedown)="$event.preventDefault()" (click)="applyCommand(item.command!)">{{ item.label }}</button>
      }
    }
    <span class="md-spacer"></span>
    <div class="md-mode" role="tablist" aria-label="Mode Markdown">
      @for (option of modes; track option.id) {
        <button type="button" class="md-mode-btn" [class.active]="mode() === option.id" role="tab" [attr.aria-selected]="mode() === option.id" (click)="setMode(option.id)">{{ option.label }}</button>
      }
    </div>
  </div>
  <div class="md-body">
    <textarea #input class="md-input" [attr.name]="name() || null" spellcheck="true" [placeholder]="placeholder()" [value]="value()" [disabled]="disabled()" [style.min-height.px]="minHeight()" (input)="onInput($event)" (blur)="onBlur()" (keydown)="onKeydown($event)" aria-label="Contenu Markdown"></textarea>
    @if (mode() !== 'edit') {
      <div class="md-preview md-rendered" role="tabpanel" tabindex="0" [innerHTML]="previewHtml()" (click)="onPreviewClick($event)" (keydown)="onPreviewKeydown($event)"></div>
    }
  </div>
</div>
