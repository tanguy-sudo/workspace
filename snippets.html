        <div class="page-header">

            <div>
              <h1 class="page-title">Snippets</h1>
              <div class="page-meta">
                <span><span id="snippet-count">0</span> snippets</span>
                <nav class="breadcrumb" id="snippet-breadcrumb"></nav>
              </div>
            </div>
            <div class="page-header-actions">
              <div class="search-bar">
                <svg
                  width="13"
                  height="13"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                >
                  <circle cx="7" cy="7" r="4.5" />
                  <path d="M10.5 10.5L14 14" />
                </svg>
                <input
                  type="text"
                  id="search-input"
                  placeholder="Rechercher titre, code, tag…"
                />
              </div>
              <button
                id="btn-fav-filter"
                class="btn btn-ghost"
                title="Favoris seulement"
              >
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                >
                  <path
                    d="M8 2l1.6 3.2 3.5.5-2.55 2.48.6 3.5L8 9.96 4.85 11.68l.6-3.5L2.9 5.7l3.5-.5z"
                  />
                </svg>
                Favoris
              </button>
              <button id="btn-import" class="btn btn-ghost">Importer</button>
              <button id="btn-new-folder" class="btn btn-ghost">
                <svg
                  width="13"
                  height="13"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                >
                  <path
                    d="M1.5 4a1 1 0 011-1h3.17a1 1 0 01.71.29l1.12 1.12a1 1 0 00.71.3H13.5a1 1 0 011 1v6a1 1 0 01-1 1h-11a1 1 0 01-1-1V4z"
                  />
                </svg>
                Dossier
              </button>
              <button id="btn-snip-select" class="btn btn-ghost" title="Sélection multiple">
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="1.5" y="1.5" width="5" height="11" rx="1"/><path d="M9 4.5h5.5M9 8h5.5M9 11.5h5.5"/></svg>
                Sélectionner
              </button>
              <button id="btn-snip-view-toggle" class="btn btn-ghost" title="Changer de vue">
                <svg id="snip-icon-grid" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="1.5" y="1.5" width="5" height="5" rx="1"/><rect x="9.5" y="1.5" width="5" height="5" rx="1"/><rect x="1.5" y="9.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/></svg>
                <svg id="snip-icon-list" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="display:none"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
                <span id="snip-view-label">Grille</span>
              </button>
              <button id="btn-new-snippet" class="btn btn-primary">
                <svg
                  width="13"
                  height="13"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                >
                  <path d="M8 3v10M3 8h10" />
                </svg>
                Nouveau
              </button>
            </div>
          </div>
          <div class="page-header-filters">
            <div class="filter-bar" id="lang-filters"></div>
