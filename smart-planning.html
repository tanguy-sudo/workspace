    <main class="main-content">
      <div class="app-wrapper">

        <!-- En-tête -->
        <div class="page-header">
          <div class="page-header-top">
            <div>
              <h1 class="page-title">Planification</h1>
              <div class="page-meta">
                <span>Optimise ton temps selon tes tâches</span>
              </div>
            </div>
            <!-- Compteur de session (masqué par défaut) -->
            <span id="session-counter" class="plan-session-counter" style="display:none"></span>
          </div>
        </div>

        <!-- Formulaire de planification -->
        <div class="planning-form-card">
          <div class="planning-form-title">Quel est ton créneau disponible ?</div>

          <!-- Ligne 1 : temps + contexte + projet + date -->
          <div class="planning-form-row">
            <div class="field" style="margin-bottom:0">
              <label>Temps disponible (min)</label>
              <input
                type="text"
                id="p-time"
                inputmode="decimal"
                placeholder="Ex : 90 ou 60*5"
              />
              <div id="p-time-hint" class="planning-time-hint"></div>
            </div>
            <div class="field" style="margin-bottom:0">
              <label>
                Contexte
                <span style="color:var(--text-3);font-size:.75rem">(optionnel)</span>
              </label>
              <select id="p-context"></select>
            </div>
            <div class="field" style="margin-bottom:0">
              <label>
                Projet
                <span style="color:var(--text-3);font-size:.75rem">(optionnel)</span>
              </label>
              <select id="p-project"></select>
            </div>
            <div class="field" style="margin-bottom:0">
              <label>Échéance</label>
              <select id="p-date">
                <option value="all">Toutes les tâches</option>
                <option value="today">Aujourd'hui</option>
                <option value="week">Cette semaine</option>
              </select>
            </div>
          </div>

          <!-- Ligne 2 : mode de planification -->
          <div class="planning-mode-row">
            <span class="planning-mode-label">Mode</span>
            <div class="planning-mode-options">

              <label class="plan-mode-btn">
                <input type="radio" name="p-mode" value="balanced" checked />
                <span class="plan-mode-inner">
                  <svg width="13" height="13" viewBox="0 0 16 16" fill="none"
                       stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <path d="M2 8h3l2-5 3 10 2-5h2"/>
                  </svg>
                  Équilibré
                  <span class="plan-mode-desc">Priorité + temps optimisé</span>
                </span>
              </label>

              <label class="plan-mode-btn">
                <input type="radio" name="p-mode" value="focus" />
                <span class="plan-mode-inner">
                  <svg width="13" height="13" viewBox="0 0 16 16" fill="none"
                       stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <circle cx="8" cy="8" r="3"/>
                    <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2"/>
                  </svg>
                  Focus
                  <span class="plan-mode-desc">Une seule tâche clé</span>
                </span>
              </label>

              <label class="plan-mode-btn">
                <input type="radio" name="p-mode" value="sprint" />
                <span class="plan-mode-inner">
                  <svg width="13" height="13" viewBox="0 0 16 16" fill="none"
                       stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <path d="M2 13 L5 6 L8 10 L11 4 L14 8"/>
                  </svg>
                  Sprint
                  <span class="plan-mode-desc">Max de tâches courtes</span>
                </span>
              </label>

            </div>

            <!-- Actions -->
            <div class="planning-form-actions">
              <button id="btn-plan" class="btn btn-primary">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none"
                     stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                  <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2
                           M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4
                           M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/>
                  <circle cx="8" cy="8" r="3"/>
                </svg>
                Générer
              </button>
              <button id="btn-reset" class="btn btn-ghost">
                Réinitialiser
              </button>
            </div>
          </div>
        </div>

        <!-- Résultat -->
        <div id="plan-result" style="display:none">
          <div class="plan-summary" id="plan-summary"></div>

          <!-- Barre de remplissage du créneau -->
          <div id="plan-time-bar-wrap" class="plan-time-bar-wrap" style="display:none"></div>

          <div class="plan-task-list" id="plan-list"></div>
        </div>

      </div>
