<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Réplique exacte du .logo-mark :
    - background: #f0a030 (accent dark theme)
    - border-radius: 8px (3 coins arrondis)
    - clip-path: polygon(0 0, 85% 0, 100% 15%, 100% 100%, 0 100%)
      => coin supérieur-droit coupé en diagonal
    - "W" en gras, couleur fond
  -->
  <path
    d="M 8,0
       L 27.2,0
       L 32,4.8
       L 32,24
       Q 32,32 24,32
       L 8,32
       Q 0,32 0,24
       L 0,8
       Q 0,0 8,0
       Z"
    fill="#f0a030"
  />
  <text
    x="16"
    y="23"
    text-anchor="middle"
    font-family="'JetBrains Mono', 'Courier New', monospace"
    font-size="17"
    font-weight="700"
    fill="#0d1520"
    letter-spacing="0"
  >W</text>
</svg>
